services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "5433:5432" # host:container. Only for TablePlus and tests on your Mac.
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 3s
      timeout: 3s
      retries: 10

  db2:
    image: postgres:16
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "5434:5432" # shard 1, for TablePlus
    volumes:
      - pgdata2:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 3s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    # A cache needs a memory cap and an eviction policy.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    # No "ports": several replicas can't share one host port. Traffic comes
    # in through nginx. Run it with: docker compose up -d --scale app=3
    environment:
      # db = shard 0 (holds your existing rows), db2 = shard 1. The ORDER
      # defines the shard numbers: never reorder or add shards without a data
      # migration.
      DATABASE_URLS: postgres://shortener:shortener@db:5432/shortener,postgres://shortener:shortener@db2:5432/shortener
      REDIS_ADDR: redis:6379
      BASE_URL: http://localhost:8080
      ADDR: ":8080"
      CLICK_FLUSH_INTERVAL: 1s
      RATE_SHORTEN_PER_MIN: ${RATE_SHORTEN_PER_MIN:-10} # the test script turns it off temporarily
      RATE_SHORTEN_BURST: 10
      RATE_REDIRECT_PER_SEC: 0
      # nginx's address is somewhere in Docker's private range; trusting the
      # whole range is fine for local use (it also trusts other containers
      # on this network, so don't copy it to production as is).
      TRUSTED_PROXIES: "172.16.0.0/12"
      STATS_TOKEN: ""
    depends_on:
      db:
        condition: service_healthy
      db2:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The image is distroless (no shell, no curl), so the binary checks itself.
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 15s

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  pgdata2: