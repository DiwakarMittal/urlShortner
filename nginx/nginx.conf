worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # The app already logs every request; logging again at tens of
    # thousands of requests per second would only slow the benchmark.
    access_log off;

    upstream shortener {
        # Docker DNS answers "app" with every replica's IP, and nginx
        # round-robins across all of them. The name is resolved ONCE, at
        # start or reload, so after scaling or replacing a replica run:
        #   docker compose exec nginx nginx -s reload
        # (real systems use service discovery instead).
        # max_fails/fail_timeout: after 2 failures a replica is skipped for
        # 5 seconds (passive health checking).
        server app:8080 max_fails=2 fail_timeout=5s;

        # Reuse connections to the replicas; opening a new TCP connection per
        # request would burn CPU and ephemeral ports at this request rate.
        keepalive 64;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://shortener;
            proxy_http_version 1.1;
            proxy_set_header Connection "";  # required for upstream keepalive
            proxy_set_header Host $host;

            # Appends the address nginx saw. The app trusts this header only
            # because the connection comes from nginx (TRUSTED_PROXIES), and
            # reads it from the right, so a forged left side is ignored.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 1s;
            proxy_read_timeout 15s;

            # If a replica is down or answers 502/503, try another one.
            # nginx does NOT retry POST by default (it may already have been
            # processed), so creating a link is never done twice.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
        }
    }
}